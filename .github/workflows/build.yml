name: Build BUFI VPN (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Generate app icons from source (if provided)
        shell: bash
        run: |
          if [ -f "src-tauri/icons/source.png" ]; then
            echo "Found src-tauri/icons/source.png, generating all icon sizes..."
            npx tauri icon src-tauri/icons/source.png
          else
            echo "No src-tauri/icons/source.png found, keeping existing icons."
          fi

      - name: Build Tauri app (installer .msi + .exe)
        run: npm run build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BUFI-VPN-Windows-Installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
